<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"content="width=device-width,intial-scale=1.0,viewport-fit=cover"/>
    <title>AetherOS - Optical liquid glass workspace</title><title>
        <script scr="https://cdn.tailwindcess.com/3.4.17"></script>
        <link rel="preconnect" href="https://fronts.googleapis.com">
        <link rel="preconnect"herf="https://front.gstatic.com" crossorigin>
        <link href="https://fronts.googleapis.com/css2?
        family=Instrument+Serif:ital@0;1&fmily=Inter:wght@300;400;500;600&family=JetBrains+mono:wght@400;500&disply=swap"rel="stylesheet" >
<style>
    *{ box-sizing:border-box;}
    body,html{
        margin: 0;padding: 0;
        width: 100%;height: 100%;
        overflow:hidden;
        font-family: 'inter', -apple-system, scan-serif;
        user-select:none;
        :root{
            --glass-blur: 28px;
            --glass-sat: 195%;
            --refraction- scale; 18;
            --accent:#38bdf8;
            --radius-window: 22px;
            --spring-ease:cubic-bezier(0.22,1,0.36,1);
        }
        html[data-theme="dark"]{
            --bg-fallback: #06080;
            --text-primary: #f4f6fb;
            --glass-surface: rgba(14, 19, 30, 0.48 );
            --glass-border-outer: rgba(255, 255, 255, 0.14);
            --glass-border-inner: rgba(255, 255, 255, 0.28);
            --glass-rim-top: rgba(255, 255, 255, 0.08);
        }
        html[data-theme="light"]{
            --bg-fallback: #e8eef5;
            --text-primary: #e90d16;
            --glass-surface: rgba(255, 255, 255, 0.46);
            --glass-border-outer: rgba(255, 255, 255, 0.78);
            --glass-border-inner: rgba(255, 255, 255, 0.96);
            --glass-rim-top: rgba(255, 255, 255, 0.98);
        }
        .liquid-glass{
            background: var(--glass-surface);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
            border: 1px solid var(--glass-border-outer); 
    }
</style>
