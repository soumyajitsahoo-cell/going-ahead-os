<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --blur: 24px;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --accent-border: rgba(56, 189, 248, 0.45);
      --danger: #fb7185;
      --danger-soft: rgba(251, 113, 133, 0.15);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 9px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    html[data-theme="dark"] {
      --bg: #11131a;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --surface: rgba(18, 22, 32, 0.68);
      --surface-strong: rgba(22, 27, 40, 0.82);
      --surface-Win: rgba(16, 20, 30, 0.80);
      --surface-sub: rgba(255, 255, 255, 0.045);
      --pill: rgba(255, 255, 255, 0.06);
      --pill-hover: rgba(255, 255, 255, 0.11);
      --input-bg: rgba(10, 13, 20, 0.55);
      --border: rgba(255, 255, 255, 0.13);
      --border-strong: rgba(255, 255, 255, 0.24);
      --divider: rgba(255, 255, 255, 0.08);
      --shadow: 0 20px 48px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.35);
      --shadow-focused: 0 28px 64px rgba(0, 0, 0, 0.72), 0 6px 20px rgba(0, 0, 0, 0.45);
      --wall-overlay: rgba(10, 12, 18, 0.28);
    }

    html[data-theme="light"] {
      --bg: #e5e4df;
      --text: #0f172a;
      --text-dim: #475569;
      --surface: rgba(255, 255, 255, 0.66);
      --surface-strong: rgba(255, 255, 255, 0.84);
      --surface-Win: rgba(250, 251, 254, 0.82);
      --surface-sub: rgba(15, 23, 42, 0.035);
      --pill: rgba(255, 255, 255, 0.62);
      --pill-hover: rgba(255, 255, 255, 0.85);
      --input-bg: rgba(255, 255, 255, 0.72);
      --border: rgba(15, 23, 42, 0.12);
      --border-strong: rgba(15, 23, 42, 0.22);
      --divider: rgba(15, 23, 42, 0.08);
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.14), 0 4px 12px rgba(15, 23, 42, 0.06);
      --shadow-focused: 0 24px 56px rgba(15, 23, 42, 0.22), 0 8px 20px rgba(15, 23, 42, 0.1);
      --wall-overlay: rgba(245, 243, 236, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button, .titlebar, #top-bar, #dock-bar {
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    input, textarea {
      font-family: inherit;
      color: inherit;
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    svg.icon {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      display: block;
    }

    #wallpaper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--wall-overlay);
      transition: background 0.25s ease;
    }

    #screen-tint {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9000;
      transition: background 0.2s ease;
    }

    /* Glass surfaces */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(var(--blur)) saturate(170%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(170%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .glass-strong {
      background: var(--surface-strong);
      backdrop-filter: blur(calc(var(--blur) * 1.15)) saturate(180%);
      -webkit-backdrop-filter: blur(calc(var(--blur) * 1.15)) saturate(180%);
      border: 1px solid var(--border-strong);
      box-shadow: var(--shadow-focused);
    }

    .pill {
      background: var(--pill);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }

    .pill:hover:not(:disabled) {
      background: var(--pill-hover);
      border-color: var(--border-strong);
    }

    .pill:active:not(:disabled) {
      transform: scale(0.97);
    }

    .pill.active-ring {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-border);
    }

    .field {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      transition: border-color 0.15s ease;
    }

    .field:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Top bar */
    #top-bar {
      position: fixed;
      top: 8px;
      left: 10px;
      right: 10px;
      height: 38px;
      border-radius: 13px;
      z-index: 1000;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 500;
    }

    .topbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-btn {
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
    }

    .brand-mark {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
    }

    .v-sep {
      width: 1px;
      height: 14px;
      background: var(--divider);
      margin: 0 2px;
    }

    #active-app-label {
      padding: 4px 8px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .menu-link {
      padding: 4px 9px;
      border-radius: 7px;
      color: var(--text-dim);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .menu-link:hover {
      background: var(--pill-hover);
      color: var(--text);
    }

    .top-btn {
      padding: 5px 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .top-icon-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .kbd-hint {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--surface-sub);
    }

    .badge {
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Popovers */
    .popover {
      position: fixed;
      top: 54px;
      z-index: 2000;
      border-radius: var(--radius-lg);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    #system-menu-popover {
      left: 10px;
      width: 210px;
    }

    #control-center-popover {
      right: 10px;
      width: 290px;
      padding: 14px;
      gap: 12px;
    }

    #notif-center-popover {
      right: 10px;
      width: 320px;
      max-height: calc(100vh - 120px);
      padding: 14px;
      gap: 12px;
      overflow-y: auto;
    }

    .menu-item {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      transition: background 0.15s ease;
    }

    .menu-item:hover {
      background: var(--pill-hover);
    }

    .menu-item.danger {
      color: var(--danger);
    }

    .menu-item.danger:hover {
      background: var(--danger-soft);
    }

    .h-sep {
      height: 1px;
      background: var(--divider);
      margin: 3px 0;
    }

    .cc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
      font-size: 13px;
    }

    .cc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .cc-tile {
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      border-radius: var(--radius-md);
    }

    .cc-sliders {
      padding: 12px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .slider-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    input[type="range"].slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--surface-sub);
      border: 1px solid var(--border);
      outline: none;
    }

    input[type="range"].slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--text);
      border: 2px solid var(--border-strong);
      cursor: pointer;
    }

    /* Calendar & Notifications */
    .cal-box {
      padding: 12px;
      border-radius: var(--radius-md);
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 13px;
    }

    .cal-weekdays, .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      text-align: center;
      font-size: 11px;
    }

    .cal-weekdays {
      color: var(--text-dim);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .cal-day {
      padding: 4px 0;
      border-radius: 6px;
      font-family: var(--font-mono);
    }

    .cal-day.today {
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-weight: 600;
    }

    .notif-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .link-btn {
      font-size: 11px;
      color: var(--text-dim);
      text-decoration: underline;
    }

    .link-btn:hover {
      color: var(--text);
    }

    #notif-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notif-card {
      padding: 10px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    /* Spotlight Modal */
    #spotlight-modal {
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 80px 16px 16px;
    }

    .spotlight-box {
      width: 100%;
      max-width: 520px;
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .spotlight-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--divider);
    }

    #spotlight-input {
      flex: 1;
      background: transparent;
      border: none;
      font-size: 14px;
      outline: none;
    }

    #spotlight-results {
      max-height: 300px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .spot-item {
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }

    .spot-item:hover, .spot-item[aria-selected="true"] {
      background: var(--pill-hover);
    }

    .spot-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Desktop area & icons */
    #desktop-area {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 56px 16px 88px;
      z-index: 10;
      overflow: hidden;
    }

    #desktop-icons {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(5, auto);
      gap: 10px;
      width: fit-content;
    }

    .desktop-shortcut {
      width: 88px;
      padding: 8px 6px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      transition: background 0.15s ease;
    }

    .desktop-shortcut:hover {
      background: var(--pill-hover);
    }

    .shortcut-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shortcut-label {
      font-size: 11px;
      line-height: 1.25;
      padding: 2px 6px;
      border-radius: 6px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Windows */
    #windows-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    .os-window {
      position: absolute;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-lg);
      background: var(--surface-Win);
      backdrop-filter: blur(var(--blur)) saturate(175%);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(175%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      pointer-events: auto;
      transition: opacity 0.18s ease, transform 0.18s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .os-window.focused {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-focused);
    }

    .os-window.window-minimized {
      opacity: 0;
      transform: scale(0.75) translateY(120px);
      pointer-events: none;
    }

    .os-window.window-closing {
      opacity: 0;
      transform: scale(0.94);
      pointer-events: none;
    }

    .titlebar {
      height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--divider);
      background: var(--surface-sub);
      cursor: grab;
      flex-shrink: 0;
      touch-action: none;
    }

    .titlebar:active {
      cursor: grabbing;
    }

    .win-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .win-btn {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0.78;
    }

    .win-btn:hover {
      opacity: 1;
    }

    .win-btn.close:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .win-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
    }

    .win-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      font-size: 12px;
    }

    .resize-handle { position: absolute; z-index: 30; touch-action: none; }
    .resize-r { top: 8px; right: 0; width: 6px; bottom: 8px; cursor: ew-resize; }
    .resize-l { top: 8px; left: 0; width: 6px; bottom: 8px; cursor: ew-resize; }
    .resize-b { bottom: 0; left: 8px; right: 8px; height: 6px; cursor: ns-resize; }
    .resize-t { top: 0; left: 8px; right: 8px; height: 5px; cursor: ns-resize; }
    .resize-br { bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; }
    .resize-bl { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; }

    #snap-preview {
      position: fixed;
      z-index: 900;
      pointer-events: none;
      border-radius: var(--radius-lg);
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
    }

    /* Dock */
    #dock-wrap {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1200;
      max-width: 96vw;
    }

    #dock-bar {
      padding: 7px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dock-item {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.16s ease, background 0.15s ease;
    }

    .dock-item:hover {
      transform: translateY(-4px);
    }

    .dock-tooltip {
      position: absolute;
      top: -32px;
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .dock-item:hover .dock-tooltip,
    .dock-item:focus-visible .dock-tooltip {
      opacity: 1;
    }

    .dock-dot {
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      height: 3px;
      border-radius: 999px;
      pointer-events: none;
    }

    /* Context Menu & Toasts */
    #desktop-context-menu {
      position: fixed;
      z-index: 4000;
      width: 196px;
      border-radius: var(--radius-md);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
    }

    #toast-container {
      position: fixed;
      top: 54px;
      right: 12px;
      z-index: 5000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      width: 260px;
      padding: 11px 12px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      pointer-events: auto;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    /* App Layouts: Files & Notes */
    .split-view {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .app-sidebar {
      width: 176px;
      flex-shrink: 0;
      border-right: 1px solid var(--divider);
      background: var(--surface-sub);
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
    }

    .nav-btn {
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      color: var(--text-dim);
    }

    .nav-btn:hover {
      background: var(--pill-hover);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--pill);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 500;
    }

    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-toolbar {
      height: 44px;
      padding: 0 14px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }

    .files-grid {
      flex: 1;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      overflow-y: auto;
      align-content: start;
    }

    .file-card {
      padding: 12px 10px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    .file-inspector {
      width: 200px;
      border-left: 1px solid var(--divider);
      background: var(--surface-sub);
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .note-item {
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      text-align: left;
    }

    .note-item:hover {
      background: var(--pill-hover);
    }

    .note-editor {
      width: 100%;
      height: 100%;
      padding: 14px;
      background: transparent;
      border: none;
      resize: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      overflow-y: auto;
    }

    .note-preview {
      width: 100%;
      height: 100%;
      padding: 16px;
      overflow-y: auto;
      line-height: 1.6;
      font-size: 13px;
    }

    /* Terminal */
    .term-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 12px;
      background: rgba(8, 11, 18, 0.42);
      overflow: hidden;
    }

    .term-output {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      user-select: text;
      -webkit-user-select: text;
    }

    .term-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--divider);
      margin-top: 6px;
    }

    .term-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    /* Activity Monitor */
    .mon-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow-y: auto;
    }

    .mon-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .mon-card {
      padding: 12px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mon-chart {
      width: 100%;
      height: 80px;
      display: block;
    }

    .proc-row {
      padding: 8px 0;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Calculator */
    .calc-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      outline: none;
    }

    .calc-display {
      padding: 14px;
      border-radius: var(--radius-md);
      text-align: right;
      min-height: 78px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      font-family: var(--font-mono);
    }

    .calc-keys {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .calc-key {
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calc-key.op {
      color: var(--accent);
      font-weight: 500;
    }

    .calc-key.eq {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
      font-weight: 600;
    }

    /* Settings */
    .settings-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-group {
      padding: 14px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .theme-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .theme-card {
      padding: 12px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    /* Utility classes */
    .hidden { display: none !important; }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .dim { color: var(--text-dim); }
    .accent { color: var(--accent); }
    .danger-text { color: var(--danger); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }

    @media (max-width: 640px) {
      .hide-mobile { display: none !important; }
      .file-inspector { display: none !important; }
      .app-sidebar { width: 132px; }
      .mon-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="wallpaper" aria-hidden="true"></div>
  <div id="screen-tint" aria-hidden="true"></div>

  <header id="top-bar" class="glass">
    <div class="topbar-group">

      <span id="active-app-label" class="hide-mobile">Desktop</span>

      <div class="topbar-group hide-mobile">
        <button id="top-NewNote-btn" type="button" class="menu-link">New Note</button>
        <button id="top-TileWindows-btn" type="button" class="menu-link">Tile Windows</button>
      </div>
    </div>

    <div class="topbar-group">
      <button id="theme-toggle-btn" type="button" aria-label="Switch Theme" class="pill top-btn" title="Switch Theme (Alt+T)">
        <span id="theme-toggle-icon" data-icon="moon" data-size="14"></span>
        <span id="theme-toggle-label" class="hide-mobile">Dark</span>
      </button>

      <button id="spotlight-trigger-btn" type="button" aria-label="Search" class="pill top-btn" title="Search">
        <span data-icon="search" data-size="14"></span>
        <span class="hide-mobile dim">Search</span>
      </button>

      <button id="sound-toggle-btn" type="button" aria-label="Toggle Sound" class="pill top-icon-btn" title="Toggle UI Sounds">
        <span id="sound-toggle-icon" data-icon="volume-2" data-size="14"></span>
      </button>

      <button id="control-center-btn" type="button" aria-label="Quick Settings" class="pill top-icon-btn" title="Quick Settings">
        <span data-icon="sliders-horizontal" data-size="14"></span>
      </button>

      <button id="notif-center-btn" type="button" aria-label="Notifications" class="pill top-btn" title="Notifications & Calendar">
        <span data-icon="bell" data-size="14"></span>
        <span id="notif-badge" class="badge hidden">0</span>
      </button>

      <button id="clock-btn" type="button" aria-label="Date and Time" class="pill top-btn mono">
        <span id="topbar-date" class="hide-mobile dim"></span>
        <span id="topbar-clock">--:--</span>
      </button>
    </div>
  </header>

  <div id="control-center-popover" class="popover glass-strong hidden">
    <div class="cc-header">
      <span>Quick Controls</span>
      <span id="cc-theme-indicator" class="mono dim" style="font-size:11px;">Dark</span>
    </div>

    <div class="cc-grid">
      <button id="cc-theme-card" type="button" class="pill cc-tile">
        <span id="cc-theme-icon" data-icon="moon" data-size="16"></span>
        <span style="font-weight:500;">Theme</span>
        <span id="cc-theme-sub" class="dim" style="font-size:11px;">Dark</span>
      </button>

      <button id="cc-nightshift-card" type="button" class="pill cc-tile">
        <span data-icon="sun" data-size="16"></span>
        <span style="font-weight:500;">Warm Tint</span>
        <span id="cc-nightshift-sub" class="dim" style="font-size:11px;">Off</span>
      </button>

      <button id="cc-sound-card" type="button" class="pill cc-tile">
        <span data-icon="volume-2" data-size="16"></span>

    function iconSvg(name, size = 16) {
      const paths = ICONS[name] || ICONS['info'];
      return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${paths}</svg>`;
    }

    function hydrateIcons(root = document) {
      root.querySelectorAll('[data-icon]').forEach(el => {
        const name = el.getAttribute('data-icon');
        const size = parseInt(el.getAttribute('data-size') || '16', 10);
        el.innerHTML = iconSvg(name, size);
      });
    }

    const Sound = {
      ctx: null,
      enabled: true,
      ready: false,
      beep(freq = 640, duration = 0.04, vol = 0.025) {
        if (!this.enabled || !this.ready) return;
        try {
          if (!this.ctx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) this.ctx = new Ctx();
          }
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      tap() { this.beep(680, 0.035, 0.02); },
      open() { this.beep(520, 0.06, 0.025); },
      close() { this.beep(420, 0.05, 0.02); }
    };

    window.addEventListener('pointerdown', () => { Sound.ready = true; }, { once: true });
    window.addEventListener('keydown', () => { Sound.ready = true; }, { once: true });

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtSize(dataUrl) {
      const kb = Math.max(1, Math.round((dataUrl.length * 0.75) / 1024));
      return kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB';
    }

    function evalMath(src) {
      const raw = String(src).replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      if (!raw) throw new Error('empty');
      const tokens = raw.match(/\d*\.?\d+|[()+\-*/]/g);
      if (!tokens || tokens.join('') !== raw) throw new Error('invalid');
      let pos = 0;
      const peek = () => tokens[pos];
      const next = () => tokens[pos++];
      function parseExpr() {
        let v = parseTerm();
        while (peek() === '+' || peek() === '-') {
          const op = next();
          const r = parseTerm();
          v = op === '+' ? v + r : v - r;
        }
        return v;
      }
      function parseTerm() {
        let v = parseUnary();
        while (peek() === '*' || peek() === '/') {
          const op = next();
          const r = parseUnary();
          v = op === '*' ? v * r : v / r;
        }
        return v;
      }
      function parseUnary() {
        if (peek() === '-') { next(); return -parseUnary(); }
        if (peek() === '+') { next(); return parseUnary(); }
        return parsePrimary();
      }
      function parsePrimary() {
        const t = next();
        if (t === '(') {
          const v = parseExpr();
          if (next() !== ')') throw new Error('paren');
          return v;
        }
        if (t === undefined || !/^\d*\.?\d+$/.test(t)) throw new Error('token');
        return parseFloat(t);
      }
      const result = parseExpr();
      if (pos !== tokens.length || !isFinite(result)) throw new Error('range');
      return result;
    }

    const FrameMeter = {
      fps: 0,
      frames: 0,
      last: 0,
      start() {
        this.last = performance.now();
        const loop = (t) => {
          this.frames++;
          if (t - this.last >= 1000) {
            this.fps = Math.round((this.frames * 1000) / (t - this.last));
            this.frames = 0;
            this.last = t;
          }
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
    };

    const STORAGE_KEY = 'workbench_prefs_v1';

    const State = {
      theme: 'dark',
      blur: 24,
      brightness: 100,
      warmTint: false,
      files: [],
      notifications: [],
      windows: {},
      zCounter: 120,
      focusedId: null
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.theme === 'light' || data.theme === 'dark') State.theme = data.theme;
        if (typeof data.blur === 'number') State.blur = data.blur;
        if (typeof data.brightness === 'number') State.brightness = data.brightness;
        if (typeof data.warmTint === 'boolean') State.warmTint = data.warmTint;
        if (Array.isArray(data.files)) State.files = data.files;
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          theme: State.theme,
          blur: State.blur,
          brightness: State.brightness,
          warmTint: State.warmTint,
          files: State.files
        }));
      } catch (e) {
        showToast('Storage Full', 'Browser storage limit reached.', 'info');
      }
    }

    function storageBytes() {
      try {
        return (localStorage.getItem(STORAGE_KEY) || '').length;
      } catch (e) {
        return 0;
      }
    }

    const APPS = [
      { id: 'files', name: 'Files', title: 'Files', icon: 'folder', defaultW: 720, defaultH: 460 },
      { id: 'notes', name: 'Notes', title: 'Notes', icon: 'file-text', defaultW: 700, defaultH: 460 },
      { id: 'terminal', name: 'Terminal', title: 'Terminal', icon: 'terminal', defaultW: 640, defaultH: 420 },
      { id: 'studio', name: 'Canvas', title: 'Canvas', icon: 'pen-tool', defaultW: 720, defaultH: 480 },
      { id: 'monitor', name: 'Activity', title: 'Activity', icon: 'cpu', defaultW: 660, defaultH: 440 },
      { id: 'calc', name: 'Calculator', title: 'Calculator', icon: 'calculator', defaultW: 320, defaultH: 440 },
      { id: 'settings', name: 'Settings', title: 'Settings', icon: 'sliders-horizontal', defaultW: 600, defaultH: 440 }
    ];

    function applyAppearance() {
      document.documentElement.setAttribute('data-theme', State.theme);
      document.documentElement.style.setProperty('--blur', State.blur + 'px');

      const isDark = State.theme === 'dark';
      const iconEl = document.getElementById('theme-toggle-icon');
      const labelEl = document.getElementById('theme-toggle-label');
      if (iconEl) iconEl.innerHTML = iconSvg(isDark ? 'moon' : 'sun', 14);
      if (labelEl) labelEl.textContent = isDark ? 'Dark' : 'Light';

      const ccInd = document.getElementById('cc-theme-indicator');
      const ccSub = document.getElementById('cc-theme-sub');
      const ccIcon = document.getElementById('cc-theme-icon');
      if (ccInd) ccInd.textContent = isDark ? 'Dark' : 'Light';
      if (ccSub) ccSub.textContent = isDark ? 'Dark' : 'Light';
      if (ccIcon) ccIcon.innerHTML = iconSvg(isDark ? 'moon' : 'sun', 16);

      const blurVal = document.getElementById('cc-blur-val');
      const blurSlider = document.getElementById('cc-blur-slider');
      if (blurVal) blurVal.textContent = State.blur + 'px';
      if (blurSlider) blurSlider.value = State.blur;

      const brightVal = document.getElementById('cc-bright-val');
      const brightSlider = document.getElementById('cc-bright-slider');
      if (brightVal) brightVal.textContent = State.brightness + '%';
      if (brightSlider) brightSlider.value = State.brightness;

      const tintEl = document.getElementById('screen-tint');
      if (tintEl) {
        const dimAmount = (100 - State.brightness) / 100;
        if (State.warmTint) {
          tintEl.style.background = `rgba(245, 158, 11, ${0.1 + dimAmount * 0.45})`;
        } else {
          tintEl.style.background = `rgba(0, 0, 0, ${dimAmount * 0.6})`;
        }
      }

      syncSettingsUI();
      saveState();
    }

    function toggleTheme() {
      State.theme = State.theme === 'dark' ? 'light' : 'dark';
      Sound.tap();
      applyAppearance();
    }

    function pushNotification(title, body, icon) {
      const time = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      State.notifications = [{ id: 'n_' + Date.now(), icon, title, body, time }, ...State.notifications].slice(0, 20);
      renderNotificationsAndCalendar();
    }

    function showToast(title, message, iconName = 'bell', record = false) {
      if (record) pushNotification(title, message, iconName);
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      el.setAttribute('role', 'status');
      el.className = 'toast glass-strong';
      el.innerHTML = `
        <div class="pill" style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          ${iconSvg(iconName, 14)}
        </div>
        <div style="flex:1;min-width:0;">
          <div class="truncate" style="font-weight:600;font-size:12px;"></div>
          <div class="dim" style="font-size:11px;margin-top:2px;"></div>
        </div>`;
      el.querySelector('.truncate').textContent = title;
      el.querySelector('.dim').textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(16px)';
        setTimeout(() => el.remove(), 230);
      }, 2800);
    }

    function renderDesktopIcons() {
      const container = document.getElementById('desktop-icons');
      if (!container) return;
      container.innerHTML = '';

      const shortcuts = [
        { type: 'app', appId: 'files', label: 'Files', icon: 'folder' },
        { type: 'app', appId: 'notes', label: 'Notes', icon: 'file-text' },
        { type: 'app', appId: 'terminal', label: 'Terminal', icon: 'terminal' },
        { type: 'app', appId: 'studio', label: 'Canvas', icon: 'pen-tool' },
        { type: 'app', appId: 'settings', label: 'Settings', icon: 'sliders-horizontal' }
      ];

      State.files.filter(f => f.folder === 'Desktop').forEach(file => {
        const iconMap = { markdown: 'file-text', folder: 'folder', image: 'image', code: 'file-code' };
        shortcuts.push({
          type: 'file',
          fileId: file.id,
          label: file.name,
          icon: iconMap[file.type] || 'file-text'
        });
      });

      shortcuts.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'desktop-shortcut';
        btn.innerHTML = `
          <div class="shortcut-icon glass">${iconSvg(item.icon, 20)}</div>
          <span class="shortcut-label pill">${esc(item.label)}</span>
        `;
        btn.addEventListener('click', () => {
          Sound.tap();
          if (item.type === 'app') openAppWindow(item.appId);
          else openUserFile(item.fileId);
        });
        container.appendChild(btn);
      });
    }

    function renderDock() {
      const dock = document.getElementById('dock-bar');
      if (!dock) return;
      dock.innerHTML = '';

      APPS.forEach(app => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.id = `dock-btn-${app.id}`;
        btn.setAttribute('aria-label', app.name);
        btn.className = 'dock-item pill';
        btn.innerHTML = `
          ${iconSvg(app.icon, 19)}
          <span class="dock-tooltip glass-strong">${esc(app.name)}</span>
          <span class="dock-dot" style="display:none"></span>
        `;
        btn.addEventListener('click', () => toggleOrOpenApp(app.id));
        dock.appendChild(btn);
      });

      refreshDockState();
    }

    function refreshDockState() {
      APPS.forEach(app => {
        const btn = document.getElementById(`dock-btn-${app.id}`);
        if (!btn) return;
        const win = State.windows[app.id];
        const isOpen = !!(win && win.open);
        const isFocused = isOpen && !win.minimized && State.focusedId === app.id;
        const dot = btn.querySelector('.dock-dot');
        if (!dot) return;
        dot.style.display = isOpen ? 'block' : 'none';
        dot.style.width = isFocused ? '10px' : '4px';
        dot.style.background = isFocused ? 'var(--accent)' : 'currentColor';
        btn.setAttribute('aria-pressed', String(isOpen && !win.minimized));
      });
    }

    function toggleOrOpenApp(appId) {
      const win = State.windows[appId];
      if (!win || !win.open) openAppWindow(appId);
      else if (win.minimized) restoreWindow(appId);
      else if (State.focusedId === appId) minimizeWindow(appId);
      else focusWindow(appId);
    }

    function openAppWindow(appId, payload = null) {
      const app = APPS.find(a => a.id === appId);
      if (!app) return;

      const existing = State.windows[appId];
      if (existing && existing.open) {
        if (existing.minimized) restoreWindow(appId);
        else focusWindow(appId);
        if (payload && existing.onPayload) existing.onPayload(payload);
        return;
      }

      Sound.open();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const openCount = Object.values(State.windows).filter(w => w.open).length;
      const offset = (openCount % 5) * 24;

      const w = Math.min(app.defaultW, vw - 24);
      const h = Math.min(app.defaultH, vh - 124);
      const left = Math.max(12, Math.min(vw - w - 12, Math.round((vw - w) / 2 - 24 + offset)));
      const top = Math.max(52, Math.min(vh - h - 84, Math.round((vh - h) / 2 - 14 + offset)));

      State.zCounter++;
      const winObj = {
        id: appId,
        open: true,
        minimized: false,
        maximized: false,
        left,
        top,
        width: w,
        height: h,
        prevBounds: null,
        zIndex: State.zCounter,
        el: null,
        onPayload: null,
        cleanup: null,
        teardown: null
      };
      State.windows[appId] = winObj;

      const container = document.getElementById('windows-container');
      const winEl = document.createElement('section');
      winEl.id = `win-${appId}`;
      winEl.setAttribute('aria-label', app.title);
      winEl.className = 'os-window focused';
      winEl.style.left = `${left}px`;
      winEl.style.top = `${top}px`;
      winEl.style.width = `${w}px`;
      winEl.style.height = `${h}px`;
      winEl.style.zIndex = winObj.zIndex;

      winEl.innerHTML = `
        <div class="titlebar">
          <div class="win-controls">
            <button type="button" data-win-act="close" aria-label="Close" class="pill win-btn close" title="Close">
              ${iconSvg('x', 12)}
            </button>
            <button type="button" data-win-act="minimize" aria-label="Minimize" class="pill win-btn" title="Minimize">
              ${iconSvg('minus', 12)}
            </button>
            <button type="button" data-win-act="maximize" aria-label="Maximize" class="pill win-btn" title="Maximize">
              ${iconSvg('maximize-2', 11)}
            </button>
          </div>

          <div class="win-title">
            ${iconSvg(app.icon, 14)}
            <span>${esc(app.title)}</span>
          </div>

          <div class="win-controls">
            <button type="button" data-win-act="snap-left" aria-label="Snap Left" class="pill win-btn hide-mobile" title="Snap Left">
              ${iconSvg('columns-2', 12)}
            </button>
          </div>
        </div>

        <div id="win-body-${appId}" class="win-body"></div>

        <div class="resize-handle resize-r" data-resize="r"></div>
        <div class="resize-handle resize-l" data-resize="l"></div>
        <div class="resize-handle resize-b" data-resize="b"></div>
        <div class="resize-handle resize-t" data-resize="t"></div>
        <div class="resize-handle resize-br" data-resize="br"></div>
        <div class="resize-handle resize-bl" data-resize="bl"></div>
      `;

      container.appendChild(winEl);
      winObj.el = winEl;

      winEl.addEventListener('mousedown', () => focusWindow(appId));

      winEl.querySelector('[data-win-act="close"]').addEventListener('click', (e) => {
        e.stopPropagation();
        closeWindow(appId);
      });
      winEl.querySelector('[data-win-act="minimize"]').addEventListener('click', (e) => {
        e.stopPropagation();
        minimizeWindow(appId);
      });
      winEl.querySelector('[data-win-act="maximize"]').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMaximizeWindow(appId);
      });
      winEl.querySelector('[data-win-act="snap-left"]').addEventListener('click', (e) => {
        e.stopPropagation();
        snapWindow(appId, 'left');
      });

      const titlebar = winEl.querySelector('.titlebar');
      titlebar.addEventListener('dblclick', () => toggleMaximizeWindow(appId));

      bindWindowDragResize(winObj, winEl, titlebar);
      mountApp(appId, winEl.querySelector(`#win-body-${appId}`), winObj, payload);
      focusWindow(appId);
    }

    function focusWindow(appId) {
      const target = State.windows[appId];
      if (!target || !target.open) return;
      State.zCounter++;
      target.zIndex = State.zCounter;
      State.focusedId = appId;

      Object.values(State.windows).forEach(w => {
        if (!w.el) return;
        if (w.id === appId) {
          w.el.style.zIndex = w.zIndex;
          w.el.classList.add('focused');
        } else {
          w.el.classList.remove('focused');
        }
      });

      const app = APPS.find(a => a.id === appId);
      const label = document.getElementById('active-app-label');
      if (label && app) label.textContent = app.name;
      refreshDockState();
    }

    function minimizeWindow(appId) {
      const win = State.windows[appId];
      if (!win || !win.open || !win.el) return;
      Sound.close();
      win.minimized = true;
      win.el.classList.add('window-minimized');
      if (State.focusedId === appId) {
        State.focusedId = null;
        document.getElementById('active-app-label').textContent = 'Desktop';
      }
      refreshDockState();
    }

    function restoreWindow(appId) {
      const win = State.windows[appId];
      if (!win || !win.open || !win.el) return;
      Sound.open();
      win.minimized = false;
      win.el.classList.remove('window-minimized');
      focusWindow(appId);
    }

    function closeWindow(appId) {
      const win = State.windows[appId];
      if (!win || !win.open || !win.el) return;
      Sound.close();
      if (typeof win.teardown === 'function') win.teardown();
      if (typeof win.cleanup === 'function') win.cleanup();
      win.open = false;
      win.el.classList.add('window-closing');
      const el = win.el;
      setTimeout(() => el.remove(), 200);
      if (State.focusedId === appId) {
        State.focusedId = null;
        document.getElementById('active-app-label').textContent = 'Desktop';
      }
      refreshDockState();
    }

    function toggleMaximizeWindow(appId) {
      const win = State.windows[appId];
      if (!win || !win.open || !win.el) return;
      Sound.tap();
      if (!win.maximized) {
        win.prevBounds = { left: win.left, top: win.top, width: win.width, height: win.height };
        win.left = 10;
        win.top = 52;
        win.width = window.innerWidth - 20;
        win.height = window.innerHeight - 124;
        win.maximized = true;
      } else {
        const b = win.prevBounds || { left: 80, top: 70, width: 680, height: 450 };
        win.left = b.left;
        win.top = b.top;
        win.width = b.width;
        win.height = b.height;
        win.maximized = false;
      }
      applyWindowBounds(win);
    }

    function snapWindow(appId, side) {
      const win = State.windows[appId];
      if (!win || !win.open || !win.el) return;
      Sound.tap();
      win.prevBounds = { left: win.left, top: win.top, width: win.width, height: win.height };
      const halfW = Math.floor((window.innerWidth - 28) / 2);
      win.top = 52;
      win.height = window.innerHeight - 124;
      win.width = halfW;
      win.left = side === 'left' ? 10 : 18 + halfW;
      win.maximized = false;
      applyWindowBounds(win);
    }

    function applyWindowBounds(win) {
      if (!win.el) return;
      win.el.style.left = `${win.left}px`;
      win.el.style.top = `${win.top}px`;
      win.el.style.width = `${win.width}px`;
      win.el.style.height = `${win.height}px`;
    }

    function clampWindows() {
      Object.values(State.windows).forEach(w => {
        if (w.open && w.el && !w.maximized) {
          w.left = Math.max(8, Math.min(window.innerWidth - 140, w.left));
          w.top = Math.max(48, Math.min(window.innerHeight - 100, w.top));
          applyWindowBounds(w);
        }
      });
    }

    function tileOpenWindows() {
      const openWins = Object.values(State.windows).filter(w => w.open && !w.minimized);
      if (!openWins.length) {
        showToast('Tile Windows', 'No open windows on the desktop.', 'columns-2');
        return;
      }
      Sound.tap();
      const count = openWins.length;
      const cols = count === 1 ? 1 : 2;
      const rows = Math.ceil(count / cols);
      const availW = window.innerWidth - 20;
      const availH = window.innerHeight - 126;
      const cellW = Math.floor(availW / cols) - 6;
      const cellH = Math.floor(availH / rows) - 6;

      openWins.forEach((win, i) => {
        const c = i % cols;
        const r = Math.floor(i / cols);
        win.left = 10 + c * (cellW + 8);
        win.top = 52 + r * (cellH + 8);
        win.width = Math.max(280, cellW);
        win.height = Math.max(220, cellH);
        win.maximized = false;
        applyWindowBounds(win);
      });
    }

    function cascadeOpenWindows() {
      const openWins = Object.values(State.windows).filter(w => w.open && !w.minimized);
      if (!openWins.length) return;
      Sound.tap();
      openWins.forEach((win, i) => {
        win.left = 60 + i * 28;
        win.top = 60 + i * 26;
        win.width = Math.min(680, window.innerWidth - 96);
        win.height = Math.min(450, window.innerHeight - 160);
        win.maximized = false;
        applyWindowBounds(win);
        focusWindow(win.id);
      });
    }

    function bindWindowDragResize(winObj, winEl, titlebar) {
      const snapEl = document.getElementById('snap-preview');
      const listeners = [];
      const on = (target, type, fn) => {
        target.addEventListener(type, fn);
        listeners.push(() => target.removeEventListener(type, fn));
      };

      let dragging = false;
      let startX = 0, startY = 0, initL = 0, initT = 0;
      let pendingSnap = null;

      on(titlebar, 'pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        if (e.target.closest('button')) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initL = winObj.left;
        initT = winObj.top;
        if (titlebar.setPointerCapture) titlebar.setPointerCapture(e.pointerId);
        focusWindow(winObj.id);
      });

      on(window, 'pointermove', (e) => {
        if (!dragging) return;
        const cx = e.clientX;
        const cy = e.clientY;
        winObj.left = Math.max(-winObj.width + 140, Math.min(window.innerWidth - 140, initL + (cx - startX)));
        winObj.top = Math.max(48, Math.min(window.innerHeight - 96, initT + (cy - startY)));
        winEl.style.left = `${winObj.left}px`;
        winEl.style.top = `${winObj.top}px`;

        const preview = (side, l, t, w, h) => {
          pendingSnap = side;
          snapEl.classList.remove('hidden');
          snapEl.style.left = l;
          snapEl.style.top = t;
          snapEl.style.width = w;
          snapEl.style.height = h;
        };
        if (cx < 24) {
          preview('left', '10px', '52px', `${Math.floor((window.innerWidth - 28) / 2)}px`, `${window.innerHeight - 124}px`);
        } else if (cx > window.innerWidth - 24) {
          const hw = Math.floor((window.innerWidth - 28) / 2);
          preview('right', `${18 + hw}px`, '52px', `${hw}px`, `${window.innerHeight - 124}px`);
        } else if (cy < 52) {
          preview('max', '10px', '52px', `${window.innerWidth - 20}px`, `${window.innerHeight - 124}px`);
        } else {
          pendingSnap = null;
          snapEl.classList.add('hidden');
        }
      });

      const stopDrag = () => {
        if (!dragging) return;
        dragging = false;
        snapEl.classList.add('hidden');
        if (pendingSnap === 'left' || pendingSnap === 'right') snapWindow(winObj.id, pendingSnap);
        else if (pendingSnap === 'max') {
          winObj.maximized = false;
          toggleMaximizeWindow(winObj.id);
        }
        pendingSnap = null;
      };

      on(window, 'pointerup', stopDrag);
      on(window, 'pointercancel', stopDrag);

      let resizing = false;
      let dir = '';
      let rx = 0, ry = 0, rw = 0, rh = 0, rl = 0, rt = 0;

      winEl.querySelectorAll('.resize-handle').forEach(handle => {
        handle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          e.preventDefault();
          resizing = true;
          dir = handle.getAttribute('data-resize');
          rx = e.clientX;
          ry = e.clientY;
          rw = winObj.width;
          rh = winObj.height;
          rl = winObj.left;
          rt = winObj.top;
          if (handle.setPointerCapture) handle.setPointerCapture(e.pointerId);
          focusWindow(winObj.id);
        });
      });

      on(window, 'pointermove', (e) => {
        if (!resizing) return;
        const dx = e.clientX - rx;
        const dy = e.clientY - ry;
        if (dir.includes('r')) winObj.width = Math.max(290, rw + dx);
        if (dir.includes('b')) winObj.height = Math.max(220, rh + dy);
        if (dir.includes('l')) {
          const nw = Math.max(290, rw - dx);
          if (nw > 290) { winObj.width = nw; winObj.left = rl + dx; }
        }
        if (dir.includes('t')) {
          const nh = Math.max(220, rh - dy);
          if (nh > 220 && rt + dy >= 48) { winObj.height = nh; winObj.top = rt + dy; }
        }
        applyWindowBounds(winObj);
      });

      const stopResize = () => { resizing = false; };
      on(window, 'pointerup', stopResize);
      on(window, 'pointercancel', stopResize);

      winObj.teardown = () => listeners.forEach(fn => fn());
    }

    function mountApp(appId, bodyEl, winObj, payload) {
      switch (appId) {
        case 'files': return mountFilesApp(bodyEl);
        case 'notes': return mountNotesApp(bodyEl, winObj, payload);
        case 'terminal': return mountTerminalApp(bodyEl);
        case 'studio': return mountStudioApp(bodyEl, winObj, payload);
        case 'monitor': return mountMonitorApp(bodyEl, winObj);
        case 'calc': return mountCalcApp(bodyEl);
        case 'settings': return mountSettingsApp(bodyEl);
      }
    }

    function openUserFile(fileId) {
      const file = State.files.find(f => f.id === fileId);
      if (!file) return;
      if (file.type === 'image') openAppWindow('studio', { fileId });
      else openAppWindow('notes', { fileId });
    }

    function mountFilesApp(bodyEl) {
      let currentFolder = 'Desktop';
      let query = '';
      let selectedId = null;

      const folders = [
        { name: 'Desktop', icon: 'monitor' },
        { name: 'Documents', icon: 'file-text' },
        { name: 'Pictures', icon: 'image' },
        { name: 'Code', icon: 'file-code' },
        { name: 'Trash', icon: 'trash-2' }
      ];

      bodyEl.innerHTML = `
        <div class="split-view">

              <div style="display:flex;justify-content:space-between;">
                <span class="dim">Items</span>
                <span id="files-count-label">0</span>
              </div>
            </div>
          </aside>

          <div class="app-main">
            <div class="app-toolbar">
              <span id="files-breadcrumb" class="mono dim">/Desktop</span>
              <div style="display:flex;align-items:center;gap:8px;">

      const crumbEl = bodyEl.querySelector('#files-breadcrumb');
      const countEl = bodyEl.querySelector('#files-count-label');

      function render() {
        navEl.innerHTML = '';
        folders.forEach(f => {
          const active = f.name === currentFolder;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `nav-btn ${active ? 'active' : ''}`;

          btn.innerHTML = `
            <span style="display:flex;align-items:center;gap:8px;">${iconSvg(f.icon, 14)} ${f.name}</span>

          `;

            Sound.tap();
            currentFolder = f.name;
            selectedId = null;
            render();
          });
          navEl.appendChild(btn);
        });

        crumbEl.textContent = `/${currentFolder}`;
        countEl.textContent = String(State.files.length);

        const list = State.files.filter(item => {
          const inFolder = query ? true : item.folder === currentFolder;
          return inFolder && item.name.toLowerCase().includes(query.toLowerCase());
        });

        gridEl.innerHTML = '';
        if (!list.length) {
          gridEl.innerHTML = `
            <div class="dim" style="grid-column:1/-1;padding:42px 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;">
              ${iconSvg('folder', 26)}
              <div>/${currentFolder} is empty</div>
            </div>
          `;
        } else {
          list.forEach(file => {
            const isSel = file.id === selectedId;
            const iconMap = { markdown: 'file-text', text: 'file-text', image: 'image', code: 'file-code', folder: 'folder' };
            const card = document.createElement('button');
            card.type = 'button';
            card.setAttribute('aria-pressed', String(isSel));
            card.className = `pill file-card ${isSel ? 'active-ring' : ''}`;
            card.innerHTML = `
              <div class="glass" style="width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;">
                ${iconSvg(iconMap[file.type] || 'file-text', 18)}
              </div>
              <div style="width:100%;">
                <div class="truncate" style="font-weight:500;">${esc(file.name)}</div>
                <div class="mono dim" style="font-size:10px;margin-top:2px;">${esc(file.size)}</div>
              </div>
            `;
            card.addEventListener('click', () => {
              Sound.tap();
              selectedId = file.id;
              render();
            });
            card.addEventListener('dblclick', () => openUserFile(file.id));
            gridEl.appendChild(card);
          });
        }

        const sel = State.files.find(f => f.id === selectedId);

            saveState();
            renderDesktopIcons();
            render();

      bodyEl.querySelector('#files-search').addEventListener('input', (e) => {
